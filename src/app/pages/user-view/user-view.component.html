
<main class="userView">
  <h1 class="text__title m-4">Vista detalle usuario</h1>

  <article class="card">
    <figure>
      <img
        [src]="userDetail?.image"
        class="card-img-top"
        alt="Imagen del usuario"
      />
    </figure>

    <section class="card-body">
      <header>
        <h2 class="card-title">{{ userDetail?.first_name }}</h2>
        <h2 class="card-title">{{ userDetail?.last_name }}</h2>
      </header>
      <hr />

      <!-- Usuario -->
      <dl class="row mb-2">
        <dt class="col-3 fw-bold">Usuario:</dt>
        <dd class="col-9">{{ userDetail?.username }}</dd>
      </dl>

      <!-- Email -->
      <dl class="row mb-2 align-items-center">
        <dt class="col-3 fw-bold">Email:</dt>
        <dd class="col-9">
          <input
            type="text"
            class="form-control-plaintext w-100"
            [value]="userDetail?.email"
            readonly
          />
        </dd>
      </dl>

      <!-- Password -->
      <dl class="row mb-2 align-items-center">
        <dt class="col-3 fw-bold">Password:</dt>
        <dd class="col-9">
          <input
            type="password"
            class="form-control-plaintext w-100"
            [value]="userDetail?.password"
            readonly
          />
        </dd>
      </dl>

      <!-- Nº Id -->
      <dl class="row mb-2">
        <dt class="col-3 fw-bold">Nº Id:</dt>
        <dd class="col-9">{{ userDetail?.id }}</dd>
      </dl>

      <!-- Id -->
      <dl class="row mb-3">
        <dt class="col-3 fw-bold">Id:</dt>
        <dd class="col-9 text-truncate" title="{{ userDetail?._id }}">
          {{ userDetail?._id }}
        </dd>
      </dl>

      <!-- Botones -->
      <nav class="d-flex gap-2" aria-label="Acciones de usuario">
        <button (click)="openModal()" class="btn btn-danger btn-lg flex-fill">
          Eliminar
        </button>
        <a
          [routerLink]="['/user/edit', userDetail?._id]"
          class="btn btn-primary btn-lg flex-fill"
        >Actualizar</a>
        <a [routerLink]="['/home']" class="btn btn-secondary btn-lg flex-fill"
        >Volver a listado</a>
      </nav>
    </section>
  </article>

  <router-outlet></router-outlet>
</main>
